version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: airborne-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: airborne_autopilot
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - airborne-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7.0-alpine
    container_name: airborne-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - airborne-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Server
  backend:
    build:
      context: ./airborne-autopilot-backend
      dockerfile: Dockerfile
    container_name: airborne-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://admin:password123@mongo:27017/airborne_autopilot?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
      FRONTEND_URL: http://localhost:3001
      OPENWEATHER_API_KEY: demo
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - airborne-network
    volumes:
      - ./airborne-autopilot-backend/src:/app/src
      - ./airborne-autopilot-backend/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Server
  frontend:
    build:
      context: ./airborne-autopilot-pro\ \(4\)
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001
    container_name: airborne-frontend
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:5001
      VITE_GOOGLE_MAPS_KEY: AIzaSyDEpy_UKoOH2NSjpNf_RfJFXjpYDXGQs5U
    depends_on:
      - backend
    networks:
      - airborne-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: airborne-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - airborne-network
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  airborne-network:
    driver: bridge
